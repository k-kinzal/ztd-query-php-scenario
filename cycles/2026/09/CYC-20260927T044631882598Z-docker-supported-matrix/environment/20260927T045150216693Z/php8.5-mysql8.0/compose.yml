name: ztd-matrix-20260927t045150216693z-1
services:
  mysql:
    profiles:
      - mysql
    environment:
      MYSQL_DATABASE: ztd_test
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -uroot -D ztd_test -e "SELECT
          1"
      timeout: 5s
      interval: 3s
      retries: 60
      start_period: 15s
    image: mysql:8.0
    networks:
      default: null
    platform: linux/arm64
  mysql-test:
    profiles:
      - mysql
    build:
      context: /Users/ab/Projects/ztd-query-php-scenario
      dockerfile: Dockerfile
      args:
        PHP_IMAGE: php:8.5-cli-bookworm
        PHP_VERSION: "8.5"
        SQLITE_SHA256: ""
        SQLITE_URL: ""
        SQLITE_VERSION: system
    command:
      - php
      - scripts/matrix-probe.php
    depends_on:
      mysql:
        condition: service_healthy
        required: true
    entrypoint: []
    environment:
      EXPECTED_DATABASE: "8.0"
      EXPECTED_PHP: "8.5"
      EXPECTED_SQLITE: system
      MATRIX_DATABASE: mysql
      MYSQL_DATABASE: ztd_test
      MYSQL_HOST: mysql
      MYSQL_PASSWORD: root
      MYSQL_PORT: "3306"
      MYSQL_USER: root
      ZTD_MYSQL_DATABASE: ztd_test
      ZTD_MYSQL_HOST: mysql
      ZTD_MYSQL_PASSWORD: root
      ZTD_MYSQL_PORT: "3306"
      ZTD_MYSQL_USER: root
      ZTD_TYPES_DSN: mysql:host=mysql;port=3306;dbname=ztd_test;charset=utf8mb4
      ZTD_TYPES_PASSWORD: root
      ZTD_TYPES_USER: root
      ZTD_VERSION_LOG: /evidence/versions.json
    image: ztd-scenario-matrix:php8.5-sqlitesystem
