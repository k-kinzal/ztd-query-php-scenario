name: ztd-matrix-20260927t045523925003z-1
services:
  mysql:
    profiles:
      - mysql
    environment:
      MYSQL_DATABASE: ztd_test
      MYSQL_ROOT_HOST: '%'
      MYSQL_ROOT_PASSWORD: root
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -uroot -D ztd_test -e "SELECT
          1"
      timeout: 5s
      interval: 3s
      retries: 60
      start_period: 15s
    image: mysql:8.4
    networks:
      default: null
    platform: linux/arm64
  mysql-test:
