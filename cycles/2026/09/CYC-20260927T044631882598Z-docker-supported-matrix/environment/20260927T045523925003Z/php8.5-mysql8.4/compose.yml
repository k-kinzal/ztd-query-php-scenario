      args:
        PHP_IMAGE: php:8.5-cli-bookworm
        PHP_VERSION: "8.5"
        SQLITE_SHA256: ""
        SQLITE_URL: ""
        SQLITE_VERSION: system
    command:
      - php
      - scripts/matrix-probe.php
    depends_on:
      mysql:
        condition: service_healthy
        required: true
    entrypoint: []
    environment:
