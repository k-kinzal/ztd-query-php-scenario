# Used by scripts/docker-matrix.py. Each cell gets its own network and fresh DB.
x-client: &client
  image: ${MATRIX_PHP_IMAGE:-ztd-scenario-matrix:local}
  build:
    context: ${MATRIX_CONTEXT:-..}
    dockerfile: Dockerfile
    args:
      PHP_VERSION: ${PHP_VERSION:-8.5}
      PHP_IMAGE: ${PHP_IMAGE:-php:${PHP_VERSION:-8.5}-cli-bookworm}
      SQLITE_VERSION: ${SQLITE_VERSION:-system}
      SQLITE_URL: ${SQLITE_URL:-}
      SQLITE_SHA256: ${SQLITE_SHA256:-}
  entrypoint: []
  command: [php, scripts/matrix-probe.php]
  volumes:
    - ${MATRIX_OUTPUT:-../build/docker-matrix/manual}:/evidence
  environment: &client-env
    MATRIX_DATABASE: ${MATRIX_DATABASE:-sqlite}
    EXPECTED_PHP: ${PHP_VERSION:-8.5}
    EXPECTED_DATABASE: ${EXPECTED_DATABASE:-3}
    EXPECTED_SQLITE: ${SQLITE_VERSION:-system}
    ZTD_VERSION_LOG: /evidence/versions.json

services:
  sqlite:
    <<: *client
  mysql-test:
    <<: *client
    profiles: [mysql]
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *client-env
      MATRIX_DATABASE: mysql
      EXPECTED_DATABASE: ${EXPECTED_DATABASE:-8.0}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: root
      MYSQL_DATABASE: ztd_test
      ZTD_MYSQL_HOST: mysql
      ZTD_MYSQL_PORT: 3306
      ZTD_MYSQL_USER: root
      ZTD_MYSQL_PASSWORD: root
      ZTD_MYSQL_DB: ztd_test
      ZTD_TYPES_DSN: mysql:host=mysql;port=3306;dbname=ztd_test;charset=utf8mb4
      ZTD_TYPES_USER: root
      ZTD_TYPES_PASSWORD: root
  postgres-test:
    <<: *client
    profiles: [postgres]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *client-env
      MATRIX_DATABASE: postgres
      EXPECTED_DATABASE: ${EXPECTED_DATABASE:-16}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DATABASE: ztd_test
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    platform: ${MYSQL_PLATFORM:-}
    profiles: [mysql]
    command: ["--performance-schema=OFF", "--innodb-buffer-pool-size=32M", "--innodb-log-buffer-size=8M", "--max-connections=20"]
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: ztd_test
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD=root mysql --protocol=tcp -h 127.0.0.1 -uroot -D ztd_test -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 15s
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16}
    profiles: [postgres]
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ztd_test
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d ztd_test']
      interval: 3s
      timeout: 5s
      retries: 60
      start_period: 10s
